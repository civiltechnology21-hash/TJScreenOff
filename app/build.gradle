plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tj.screenoff'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tj.screenoff'
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party dependencies on purpose: the app only uses the Android framework.
